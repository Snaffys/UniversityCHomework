name: Build and Lint

on:
  push:
  pull_request:

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-19 \
            clang-format-19 \
            clang-tidy-19 \
            build-essential \
            ocl-icd-opencl-dev \
            opencl-headers
      
      - name: Run full lint
        run: make format-check && make tidy

      - name: Build project
        run: make

      - name: Run tests
        run: make test
